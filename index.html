<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sri Lanka Disaster Management Platform - Report emergencies, find missing persons, coordinate rescue efforts" />
    <meta name="theme-color" content="#f8fafc" />
    
    <!-- Preconnect to Supabase for faster API/storage connections -->
    <link rel="preconnect" href="https://imwsvbyqivsfyomrkppa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://imwsvbyqivsfyomrkppa.supabase.co" />
    
    <!-- Preconnect to Supabase Storage for faster image loading -->
    <link rel="preconnect" href="https://imwsvbyqivsfyomrkppa.supabase.co/storage" crossorigin />
    
    <!-- Preconnect to map tiles -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />

    <!-- Display typeface with true bold/black weights (avoids browser-synthesized bold artifacts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Critical CSS will be inlined by Vite -->
    <title>Disaster Management - Sri Lanka</title>
    <script>
      // Applied before paint so the correct theme renders immediately (no flash).
      try {
        var t = localStorage.getItem('resqlink_theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
